name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate and package
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_release.py
      - name: Check archive checksum
        working-directory: dist
        run: sha256sum --check AI-Agents-1.4.0.zip.sha256
