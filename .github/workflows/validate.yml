name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Enable Intel smoke test on Apple Silicon
        run: |
          if [[ "$(uname -m)" == arm64 ]] && ! /usr/bin/arch -x86_64 /usr/bin/true; then
            softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Build and test the universal archive
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_release.py
      - name: Check archive checksum
        working-directory: dist
        run: shasum -a 256 -c AI-Agents-*.zip.sha256
